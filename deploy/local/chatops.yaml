apiVersion: v1
kind: ConfigMap
metadata:
  name: chatops-config
  namespace: ops-butler
data:
  SLACK_ENABLED: "true"
  SLACK_TOKEN: "xoxb-your-slack-bot-token"
  SLACK_SIGNING_SECRET: "your-slack-signing-secret"
  SLACK_DEFAULT_CHANNEL: "#ops-alerts"
  
  GOOGLE_CHAT_ENABLED: "false"
  GOOGLE_CHAT_SERVICE_ACCOUNT: "/path/to/service-account.json"
  GOOGLE_CHAT_PROJECT_ID: "your-google-cloud-project"
  GOOGLE_CHAT_DEFAULT_SPACE: "spaces/your-space-id"
---
apiVersion: v1
kind: Service
metadata:
  name: ops-butler-webhooks
  namespace: ops-butler
spec:
  selector:
    app: ops-butler-api
  ports:
    - name: webhooks
      port: 8080
      targetPort: 8080
  type: LoadBalancer 