apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-butler-api
  namespace: ops-butler
  labels:
    app: ops-butler-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ops-butler-api
  template:
    metadata:
      labels:
        app: ops-butler-api
    spec:
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: api
        image: crcoerph/ops-butler:api-v0.0.1-14
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: grpc
        env:
        # Database Configuration
        - name: DB_HOST
          value: ops-butler-db
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          value: postgres
        - name: DB_NAME
          value: ops_portal
        # ChatOps Configuration from ConfigMap
        - name: SLACK_ENABLED
          valueFrom:
            configMapKeyRef:
              name: chatops-config
              key: SLACK_ENABLED
        - name: SLACK_TOKEN
          valueFrom:
            configMapKeyRef:
              name: chatops-config
              key: SLACK_TOKEN
        - name: SLACK_SIGNING_SECRET
          valueFrom:
            configMapKeyRef:
              name: chatops-config
              key: SLACK_SIGNING_SECRET
        - name: SLACK_DEFAULT_CHANNEL
          valueFrom:
            configMapKeyRef:
              name: chatops-config
              key: SLACK_DEFAULT_CHANNEL
        - name: SLACK_DEMO_MODE
          valueFrom:
            configMapKeyRef:
              name: chatops-config
              key: SLACK_DEMO_MODE
        - name: SLACK_APP_ID
          valueFrom:
            configMapKeyRef:
              name: chatops-config
              key: SLACK_APP_ID
        - name: SLACK_BOT_USER_ID
          valueFrom:
            configMapKeyRef:
              name: chatops-config
              key: SLACK_BOT_USER_ID
        - name: GOOGLE_CHAT_ENABLED
          valueFrom:
            configMapKeyRef:
              name: chatops-config
              key: GOOGLE_CHAT_ENABLED
        # Additional settings
        - name: LOG_LEVEL
          value: "debug"
        - name: SERVER_PORT
          value: "8080"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ops-butler-api
  namespace: ops-butler
  labels:
    app: ops-butler-api
spec:
  selector:
    app: ops-butler-api
  ports:
  - port: 8080
    targetPort: http
    name: http
  - port: 9090
    targetPort: grpc
    name: grpc
  type: ClusterIP
